services:
  python-rpa:
    build: .
    container_name: santander-python-rpa
    restart: unless-stopped
    networks: [automacao]
  n8n:
    image: n8nio/n8n:latest
    container_name: santander-n8n
    restart: unless-stopped
    ports: ["5678:5678"]
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
    volumes: ["n8n_data:/home/node/.n8n"]
    depends_on: [python-rpa]
    networks: [automacao]
volumes:
  n8n_data:
networks:
  automacao:
